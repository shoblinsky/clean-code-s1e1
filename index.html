<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen">
  </head>
<body class="page">
  <header class="page__header">
    <h1><img src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix, or Urgent-Important Matrix" class="header__image"></h1>
    <a href="https://goal-life.com/page/method/matrix-eisenhower" class="header__link">Want more details?</a>
  </header>
  <main class="main">
    <div class="main__div">
      <label for="new-task" class="main__div-name">Add Item</label>
      <div class="main__wrapper">
        <input id="new-task" class="main__wrapper-task" type="text">
        <button class="main__wrapper-btn">Add</button>
      </div>
  </div>
  <section class="section todo">
    <h2 class="section__header">Todo</h2>
    <ul class="section__ul" id="incompleted-tasks">
      <li class="section__ul-li">
        <input type="checkbox" class="li-checkbox">
        <label class="li-task li-label">Pay Bills</label>
        <input type="text" class="li-task li-input li__task-input">
        <button class="li-edit">Edit</button>
        <button class="li-delete"><img src="./remove.svg" alt="delete task button" class="li-delete-img"></button>
      </li>
      <li class="section__ul-li editMode">
        <input type="checkbox" class="li-checkbox">
        <label class="li-task li-label li-edit-mode__task-label">Go Shopping</label>
        <input type="text" value="Go Shopping" class="li-task li-input li-edit-mode__task-input">
        <button class="li-edit">Save</button>
        <button class="li-delete"><img src="./remove.svg" alt="delete task button" class="li-delete-img"></button>
      </li>
    </ul>
  </section>
  <section class="section completed">
    <h2 class="section__header">Completed</h2>
    <ul class="section__ul" id="completed-tasks">
      <li class="section__ul-li">
        <input type="checkbox" class="li-checkbox" checked>
        <label class="li-task li-label li-completed__task-label">See the Doctor</label>
        <input type="text" class="li-task li-input li__task-input li-completed__task-input">
        <button class="li-edit">Edit</button>
        <button class="li-delete"><img src="./remove.svg" alt="delete task button" class="li-delete-img"></button>
      </li>
    </ul>
  </section>
</main>
<script src="app.js"></script>
</html>
